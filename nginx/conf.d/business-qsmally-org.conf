
map $request_uri $redirect {
    default  0;
    /contact mailto:info@qsmally.org;
    /github  https://github.com/QSmally;
    /home    https://qsmally.org;
    /mirror  https://github.com/QSmally/Business;
    /privacy https://qsmally.org/privacy;
    /qcpu    https://qcpu.qsmally.org;
}

server {
    listen      80;
    server_name business-qsmally-org;
    root        /usr/share/nginx/html;

    location ~ ^/(\.git.*|nginx) {
        deny all;
    }

    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    if ($redirect) {
        return 301 $redirect;
    }
}
